services:

  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: finora_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
    networks:
      - finora

  nginx:
    image: nginx:alpine
    container_name: finora_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - finora

  mysql:
    image: mysql:8.0
    container_name: finora_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: MYSQL_DATABASE
      MYSQL_USER: MYSQL_USER
      MYSQL_PASSWORD: Finora@MYSQL_PASSWORD
      MYSQL_ROOT_PASSWORD: MYSQL_ROOT_PASSWORD
    ports:
      - "3307:3306"
    volumes:
      - finora_mysql_data:/var/lib/mysql
    networks:
      - finora

  redis:
    image: redis:7-alpine
    container_name: finora_redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - finora_redis_data:/data
    networks:
      - finora

networks:
  finora:

volumes:
  finora_mysql_data:
  finora_redis_data:
